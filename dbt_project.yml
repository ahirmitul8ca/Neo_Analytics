# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'neo_analytics'
version: '1.0.0'
config-version: 2

profile: 'neo_analytics'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

models:
  neo_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
seeds:
  neo_analytics:
    fee_plans:
      +column_types:
        monthly_cap_cad: float64
        percentage_fee: float64
        flat_fee_cad: float64