name: 'neo_analytics'
version: '1.0.0'
config-version: 2

profile: 'neo_analytics'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

models:
  neo_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
seeds:
  neo_analytics:
    fee_plans:
      +column_types:
        monthly_cap_cad: float64
        base_rate_pct: float64
        fixed_fee_cad: float64

data_tests:
  +store_failures: true
  +schema: dbt_test_audit